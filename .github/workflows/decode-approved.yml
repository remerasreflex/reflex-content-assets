name: Decode Approved Asset

on:
  push:
    branches: ["main"]
    paths:
      - "staging/*.b64"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged assets
        run: |
          mkdir -p approved
          shopt -s nullglob
          for f in staging/*.b64; do
            name="$(basename "$f" .b64)"
            base64 -d "$f" > "approved/$name.jpg"
          done
      - name: Commit decoded assets
        run: |
          git config user.name "reflex-content-agent"
          git config user.email "actions@users.noreply.github.com"
          git add approved/*.jpg
          if git diff --cached --quiet; then
            echo "No decoded asset changes."
          else
            git commit -m "chore: decode approved asset [skip ci]"
            git push
          fi
